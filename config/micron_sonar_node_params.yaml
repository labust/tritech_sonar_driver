micron_sonar_node:
  ros__parameters:
    
    debug: false
    
    baudrate: 115200
    port: "/dev/ttyUSB0"
    
    udpPort: 4000
    udpServer: ""
    
    max_distance: 2.0     
    min_distance: 0.1  
    resolution: 0.1        
    
    stare_left_limit: false
    left_limit: 10.0      
    right_limit: -10.0    
    
    angular_resolution: 1.0 
    
    gain: 0.2              
    speed_of_propagation: 1500.0  
    
    low_resolution: true  
    
    continous: false
    invert: false          
    
    frequency_out: 15.0     
    intensity_threshold: 5.0
    min_dist_considered: 0.45
    peak_proportion: 1.25
    timeout_receive_data: 3000
    
    should_turn_on_motor: true